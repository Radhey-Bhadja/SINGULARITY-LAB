<script type="x-shader/x-vertex" id="vg">uniform vec4 uM[8];uniform int uN;varying float vD;
void main(){vec3 p=position;float d=0.;for(int i=0;i<8;i++){if(i>=uN)break;vec2 r=p.xz-uM[i].xy;d+=uM[i].z/sqrt(dot(r,r)+.15);}
d=min(d*.6,6.);p.y=-d;vD=d;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}</script>
<script type="x-shader/x-fragment" id="fg">varying float vD;void main(){vec3 c=mix(vec3(.05,.9,.1),vec3(1.,.1,.7),smoothstep(0.,4.,vD));gl_FragColor=vec4(c*(.3+.22*vD),1.);}</script>
<script type="x-shader/x-vertex" id="vp">attribute float w;uniform float uPx,uS;varying float vW;
void main(){vW=w;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=uPx*uS*(1.+w)/-mv.z;gl_Position=projectionMatrix*mv;}</script>
<script type="x-shader/x-fragment" id="fp">uniform vec3 uA,uB;varying float vW;
void main(){float r=length(gl_PointCoord-.5)*2.;if(r>1.)discard;gl_FragColor=vec4(mix(uA,uB,clamp(vW,0.,1.))*(1.-r*r)*1.5,1.);}</script>
<script type="x-shader/x-vertex" id="vq">attribute vec2 g;uniform sampler2D uT;uniform float uPx;varying vec3 vC;
void main(){vec4 t=texture2D(uT,g);float a=sqrt(t.r);vec3 p=position;p.y=a*4.+t.g*.6;float c=.5+.5*cos(t.b);
vC=mix(vec3(.1,1.,.2),vec3(0.,.9,1.),c)*clamp(a*2.,.1,2.)+vec3(1.,.1,.4)*t.g*.5;
vec4 mv=modelViewMatrix*vec4(p,1.);gl_PointSize=uPx*(.07+a*.25)/-mv.z;gl_Position=projectionMatrix*mv;}</script>
<script type="x-shader/x-fragment" id="fq">varying vec3 vC;void main(){float r=length(gl_PointCoord-.5)*2.;if(r>1.)discard;gl_FragColor=vec4(vC*(1.-r*r),1.);}</script>

<!-- PHYSICS WORKER: geodesic light / split-step-free leapfrog Schrödinger / Lorenz flow -->
<script type="text/plain" id="wk">
const N=128,P=1600,M=3000,rnd=Math.random;let mode=0,A=1,B=6,ms=[],lp=new Float32Array(P*4),R,I,V,L;
function sp(i,f){const q=i*4,a=(rnd()-.5)*.1;lp[q]=f?-10+rnd()*20:-10;lp[q+1]=(rnd()-.5)*18;lp[q+2]=Math.cos(a);lp[q+3]=Math.sin(a)}
function pk(ci,cj,kx,ky){const s=6;for(let j=2;j<N-2;j++)for(let i=2;i<N-2;i++){const dx=i-ci,dy=j-cj,g=Math.exp(-(dx*dx+dy*dy)/(2*s*s)),p=kx*dx+ky*dy,n=j*N+i;R[n]+=g*Math.cos(p);I[n]+=g*Math.sin(p)}}
function rl(i,ox){const q=i*4;L[q]=ox+(rnd()-.5)*4;L[q+1]=(rnd()-.5)*4;L[q+2]=15+rnd()*20}
function init(){if(mode==0)for(let i=0;i<P;i++)sp(i,1);else if(mode==1){R=new Float32Array(N*N);I=new Float32Array(N*N);V=new Float32Array(N*N);pk(64,64,A,0)}else{L=new Float32Array(M*4);for(let i=0;i<M;i++)rl(i,0)}}
function s0(o,dt){const c=B,h=dt/2;let hit=0,fl=0;
for(let i=0;i<P;i++){const q=i*4;let x=lp[q],z=lp[q+1],dx=lp[q+2],dz=lp[q+3],aw=0,dead=0,dep=0;
for(let s=0;s<2;s++){let ax=0,az=0;dep=0;
for(const m of ms){const rx=m[0]-x,rz=m[1]-z,r2=rx*rx+rz*rz,e=r2+.15,k=10*m[2]/(e*Math.sqrt(e));ax+=rx*k;az+=rz*k;dep+=m[2]/Math.sqrt(e);if(r2<.04*m[2]*m[2]){dead=1;hit=Math.max(hit,m[2])}}
dx+=ax*h/c;dz+=az*h/c;const n=Math.hypot(dx,dz);dx/=n;dz/=n;x+=dx*c*h;z+=dz*c*h;aw=Math.hypot(ax,az)}
if(dead||Math.abs(x)>10.5||Math.abs(z)>10.5){sp(i,0);x=lp[q];z=lp[q+1];dx=lp[q+2];dz=lp[q+3];dep=0}
lp[q]=x;lp[q+1]=z;lp[q+2]=dx;lp[q+3]=dz;const w=Math.min(1,aw*.08);fl+=w;
o[q]=x;o[q+1]=-Math.min(dep*.6,6)+.05;o[q+2]=z;o[q+3]=w}
return[ms.length,c,ms.reduce((a,m)=>a+m[2],0),hit,fl/P]}
function s1(o){const d=.2,K=(a,n)=>-.5*(a[n-1]+a[n+1]+a[n-N]+a[n+N]-4*a[n]);
for(let s=0;s<4;s++){for(let j=1;j<N-1;j++)for(let i=1;i<N-1;i++){const n=j*N+i;R[n]+=d*(K(I,n)+V[n]*I[n])}
for(let j=1;j<N-1;j++)for(let i=1;i<N-1;i++){const n=j*N+i;I[n]-=d*(K(R,n)+V[n]*R[n])}}
let nm=0,mx=0;for(let n=0;n<N*N;n++){const i=n%N,j=n/N|0,e=Math.min(i,j,N-1-i,N-1-j),f=e<10?1-.2*(1-e/10)**2:1;R[n]*=f;I[n]*=f;const p=R[n]*R[n]+I[n]*I[n];nm+=p;if(p>mx)mx=p;
o[n*4]=p;o[n*4+1]=V[n];o[n*4+2]=Math.atan2(I[n],R[n]);o[n*4+3]=1}
return[nm,Math.sqrt(mx),0,0,Math.sqrt(mx)]}
function s2(o){const r=A,sg=B,be=8/3,h=.005;let hit=0,sp=0;
for(let i=0;i<M;i++){const q=i*4;let x=L[q],y=L[q+1],z=L[q+2],sx=Math.sign(x),v=0;
for(let s=0;s<6;s++){const a=sg*(y-x),b=x*(r-z)-y,c=x*y-be*z;x+=a*h;y+=b*h;z+=c*h;v=Math.hypot(a,b,c)}
if(!(Math.abs(x)<200)){rl(i,0);continue}
if(sx*Math.sign(x)<0)hit=Math.max(hit,Math.min(1,v/100));sp+=v;
L[q]=x;L[q+1]=y;L[q+2]=z;o[q]=x*.4;o[q+1]=(z-25)*.4;o[q+2]=y*.4;o[q+3]=Math.min(1,v/90)}
return[sp/M,r,sg,hit,sp/M/90]}
onmessage=e=>{const d=e.data;
if(d.t=='mode'){mode=d.m;A=d.A;B=d.B;init()}else if(d.t=='p'){A=d.A;B=d.B}else if(d.t=='ms')ms=d.a;
else if(d.t=='pk'&&mode==1)pk(d.i,d.j,d.kx,d.ky);
else if(d.t=='bar'&&mode==1){for(let j=0;j<N;j++)for(let i=0;i<N;i++)if((i-d.i)**2+(j-d.j)**2<30)V[j*N+i]=B}
else if(d.t=='burst'&&mode==2){for(let k=0;k<400;k++)rl(rnd()*M|0,d.x)}
else if(d.t=='reset')init();
else if(d.t=='tick'){const t0=performance.now(),o=d.b,s=mode==0?s0(o,d.dt):mode==1?s1(o):s2(o);postMessage({b:o,s,m:mode,ms:performance.now()-t0},[o.buffer])}}
</script>

<script type="module">

qg.setAttribute('position',new THREE.BufferAttribute(qp,3));qg.setAttribute('g',new THREE.BufferAttribute(qu,2));
const qm=new THREE.Points(qg,new THREE.ShaderMaterial({uniforms:{uT:{value:qt},uPx:px()},vertexShader:sh('vq'),fragmentShader:sh('fq'),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));qm.frustumCulled=false;
const G=[[grid,light],[qm],[lor]];G.flat().forEach(o=>sc.add(o));

let mode=0,ms=[[0,0,2.5]],paused=0,muted=0,mx=0,my=0,sx=0,sy=0,ready=true,buf=new Float32Array(N*N*4),S=[0,0,0,0,0],wms=0,fps=60,last=performance.now(),fr=0;
const rc=new THREE.Raycaster(),pl=new THREE.Plane(new THREE.Vector3(0,1,0),0),v=new THREE.Vector3(),nd=new THREE.Vector2();

function fb(){const h=new Function('postMessage',src+';return onmessage;')(d=>setTimeout(()=>w.onmessage({data:d[0]||d}),0));

const onW=e=>{const d=e.data;buf=d.b;ready=true;if(d.m!==mode)return;S=d.s;wms=d.ms;

 else{lor.userData.ib.array.set(buf.subarray(0,M*4));lor.userData.ib.needsUpdate=true}
 if(S[3]>0)ping(S[3])};
w.onmessage=onW;

function audio(){if(ac)return;ac=new AudioContext();mg=ac.createGain();mg.gain.value=.14;mg.connect(ac.destination);
